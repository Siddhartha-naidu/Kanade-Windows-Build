name: Build Kanade Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Rust Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Setup Android NDK and Compilers
        run: |
          NDK_DIR=$ANDROID_HOME/ndk/$(ls -1 $ANDROID_HOME/ndk | head -n 1)
          echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Install Frontend Dependencies
        run: |
          npm install
          npm --prefix ui install

      - name: Install Native CLI and Cargo-NDK
        run: |
          cargo install tauri-cli
          cargo install cargo-ndk

      - name: Initialize Android Scaffolding
        run: cargo tauri android init

      - name: Build Android APK
        run: cargo tauri android build --apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kanade-Android-App
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk